<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Faculty Register</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="navbar">
      <span></span> Secure Faculty Verification
    </div>

    <div class="container">
      <div class="card">
        <h2>Faculty Registration</h2>
        <p class="subtitle">Create your account to get started</p>

        <div id="msg" class="message"></div>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="name" placeholder="Enter your full name" />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="Create a password" />
        </div>

        <button class="btn btn-primary" onclick="register()">Register</button>

        <div class="link-row">
          Already have an account? <a href="login.html">Login here</a>
        </div>
        <div class="link-row" style="margin-top:10px;">
          Are you an Admin? <a href="admin-register.html">Admin Register</a>
        </div>
      </div>
    </div>

    <script>
      async function register() {
        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();
        const msgEl = document.getElementById("msg");

        if (!name || !email || !password) {
          showMsg("Please fill in all fields.", "error");
          return;
        }

        try {
          const res = await fetch("/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, email, password }),
          });

          const data = await res.json();

          if (res.ok) {
            showMsg(data.message, "success");
            setTimeout(() => (window.location.href = "login.html"), 1500);
          } else {
            showMsg(data.message, "error");
          }
        } catch (err) {
          showMsg("Server error. Make sure backend is running.", "error");
        }
      }

      function showMsg(text, type) {
        const el = document.getElementById("msg");
        el.textContent = text;
        el.className = "message " + type;
        el.style.display = "block";
      }
    </script>
  </body>
</html>
